<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ETHIX · Card management</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ethixdesignsystem_3fcc11/styles.css">
<script src="ds/ethixdesignsystem_3fcc11/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A}
a{color:#22A075;text-decoration:none}a:hover{color:#5FBB99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: var(--surface-inverse); color: var(--text-on-dark); font-family: var(--font-text); overflow: hidden">

  <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 56px 24px 16px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-on-dark); background: rgba(255,255,255,.04); color: var(--text-on-dark); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-on-dark)">ETHIX Wallet</h1>
  </header>

  <main style="flex: 1 1 auto; overflow: auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 20px">

    <section aria-label="Everyday card" style="position: relative; overflow: hidden; height: 208px; box-sizing: border-box; border-radius: 20px; background: #141716; border: 1px solid var(--border-on-dark); padding: 22px; display: flex; flex-direction: column; justify-content: space-between; {{cardDim}}">
      <img src="ds/ethixdesignsystem_3fcc11/assets/x-device.png" alt="" aria-hidden="true" style="position: absolute; right: -50px; bottom: -60px; width: 240px; opacity: 0.28">
      <div style="position: relative; display: flex; justify-content: space-between; align-items: center">
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Logo" size="{{logoSize}}" tone="light"></x-import>
        <sc-if value="{{frozen}}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Badge" tone="onDark" size="sm">Frozen</x-import>
        </sc-if>
      </div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: var(--font-mono); font-size: 17px; letter-spacing: 0.08em; color: var(--text-on-dark)">{{cardNumber}}</span>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-on-dark-muted)"><span>Everyday card · Debit</span><span>Exp 09/29{{cvc}}</span></div>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button onClick="{{toggleFreeze}}" aria-pressed="{{frozen}}" style="min-height: 76px; border-radius: 14px; border: 1px solid {{freezeBorder}}; background: rgba(255,255,255,.04); color: var(--text-on-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-text); font-size: 12px; font-weight: 500; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h20"></path><path d="M12 2v20"></path><path d="m20 16-4-4 4-4"></path><path d="m4 8 4 4-4 4"></path><path d="m16 4-4 4-4-4"></path><path d="m8 20 4-4 4 4"></path></svg>
        {{freezeLabel}}
      </button>
      <button onClick="{{openPin}}" style="min-height: 76px; border-radius: 14px; border: 1px solid var(--border-on-dark); background: rgba(255,255,255,.04); color: var(--text-on-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-text); font-size: 12px; font-weight: 500; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Show PIN
      </button>
      <button onClick="{{toggleDetails}}" aria-pressed="{{details}}" style="min-height: 76px; border-radius: 14px; border: 1px solid var(--border-on-dark); background: rgba(255,255,255,.04); color: var(--text-on-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-text); font-size: 12px; font-weight: 500; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"></rect><path d="M2 10h20"></path></svg>
        {{detailsLabel}}
      </button>
    </div>

    <section aria-label="Monthly limit" style="padding: 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: var(--font-text); font-size: 14px; font-weight: 600; color: var(--text-on-dark)">Monthly spending</h2>
        <span style="font-family: var(--font-mono); font-size: 13px; color: var(--text-on-dark)">£812.40 <span style="color: var(--text-on-dark-muted)">/ £1,500</span></span>
      </div>
      <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,.1)"><div style="width: 54%; height: 100%; border-radius: 3px; background: var(--ethix-emerald)"></div></div>
      <span style="font-size: 12px; color: var(--text-on-dark-muted)">Resets 1 November</span>
    </section>

    <section aria-label="Card controls" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: var(--font-text); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted)">Controls</h2>
      <div style="padding: 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); display: flex; flex-direction: column; gap: 18px">
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Switch" tone="dark" label="Online payments" checked="{{online}}" on-change="{{toggleOnline}}"></x-import>
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Switch" tone="dark" label="Contactless" checked="{{contactless}}" on-change="{{toggleContactless}}"></x-import>
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Switch" tone="dark" label="Block gambling merchants" description="Applied instantly, in shops and online" checked="{{gambling}}" on-change="{{toggleGambling}}"></x-import>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" variant="onDark" size="lg" block="{{yes}}" on-click="{{openLost}}">Order a replacement card</x-import>
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" variant="ghost" size="md" block="{{yes}}" style="{{danger}}" on-click="{{openLost}}">Report lost or stolen</x-import>
    </div>
  </main>

  <sc-if value="{{pinOpen}}" hint-placeholder-val="{{ false }}">
    <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Dialog" open="{{yes}}" width="{{dialogW}}" title="Your PIN" description="Make sure no one can see your screen. ETHIX will never ask you for your PIN." on-close="{{closePin}}">
      <div style="font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.4em; text-align: center; padding: 12px 0 16px; color: var(--text-strong)">4829</div>
      <div style="display: flex; justify-content: flex-end">
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" on-click="{{closePin}}">Done</x-import>
      </div>
    </x-import>
  </sc-if>

  <sc-if value="{{lostOpen}}" hint-placeholder-val="{{ false }}">
    <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Dialog" open="{{yes}}" width="{{dialogW}}" title="Cancel this card?" description="We cancel it straight away and post a replacement within 3 working days. Your new card has a new number; your PIN stays the same." on-close="{{closeLost}}">
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px">
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" variant="secondary" on-click="{{closeLost}}">Keep card</x-import>
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" on-click="{{confirmLost}}">Cancel and replace</x-import>
      </div>
    </x-import>
  </sc-if>

  <sc-if value="{{replaced}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 24px; right: 24px; bottom: 32px">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Toast" tone="positive" title="Card cancelled" message="Replacement on its way · arrives by 22 October" on-dismiss="{{dismissToast}}"></x-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { frozen: false, online: true, contactless: true, gambling: true, pinOpen: false, details: false, lostOpen: false, replaced: false };
  }
  renderVals() {
    const s = this.state;
    return {
      yes: true,
      logoSize: 15,
      frozen: s.frozen,
      cardDim: s.frozen ? 'filter: grayscale(1); opacity: 0.6' : '',
      freezeLabel: s.frozen ? 'Unfreeze' : 'Freeze',
      freezeBorder: s.frozen ? 'var(--ethix-emerald)' : 'var(--border-on-dark)',
      toggleFreeze: () => this.setState({ frozen: !s.frozen }),
      online: s.online,
      contactless: s.contactless,
      gambling: s.gambling,
      toggleOnline: () => this.setState({ online: !s.online }),
      toggleContactless: () => this.setState({ contactless: !s.contactless }),
      toggleGambling: () => this.setState({ gambling: !s.gambling }),
      danger: { color: '#E07A6B' },
      dialogW: 320,
      details: s.details,
      detailsLabel: s.details ? 'Hide details' : 'Card details',
      cardNumber: s.details ? '4929 1834 5521 4821' : '•••• •••• •••• 4821',
      cvc: s.details ? ' · CVC 382' : '',
      toggleDetails: () => this.setState({ details: !s.details }),
      pinOpen: s.pinOpen,
      openPin: () => this.setState({ pinOpen: true }),
      closePin: () => this.setState({ pinOpen: false }),
      lostOpen: s.lostOpen,
      openLost: () => this.setState({ lostOpen: true }),
      closeLost: () => this.setState({ lostOpen: false }),
      confirmLost: () => this.setState({ lostOpen: false, frozen: true, replaced: true }),
      replaced: s.replaced,
      dismissToast: () => this.setState({ replaced: false })
    };
  }
}
</script>
</body>
</html>
