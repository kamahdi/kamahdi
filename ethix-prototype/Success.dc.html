<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ETHIX · Investment successful</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ethixdesignsystem_3fcc11/styles.css">
<script src="ds/ethixdesignsystem_3fcc11/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A}
a{color:#22A075;text-decoration:none}a:hover{color:#5FBB99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: var(--surface-inverse); color: var(--text-on-dark); font-family: var(--font-text); overflow: hidden; padding: 56px 24px 40px">

  <img src="ds/ethixdesignsystem_3fcc11/assets/x-device.png" alt="" aria-hidden="true" style="position: absolute; left: -90px; bottom: -70px; width: 320px; opacity: 0.08">

  <header style="position: relative; flex: 0 0 auto; display: flex; justify-content: flex-end">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-on-dark); background: rgba(255,255,255,.04); color: var(--text-on-dark); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </a>
  </header>

  <main style="position: relative; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 24px">
    <div style="width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--ethix-emerald); display: grid; place-items: center; margin: 0 auto; color: var(--g-400); font-size: 36px; line-height: 1" aria-hidden="true">✓</div>
    <div style="display: flex; flex-direction: column; gap: 10px; text-align: center">
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; color: var(--text-on-dark)">Investment <span style="color: var(--g-400)">successful.</span></h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: var(--text-on-dark-muted)">Your £250.00 investment has been placed successfully.</p>
    </div>

    <dl style="margin: 0; padding: 4px 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 14px; {{r.rule}}">
          <dt style="color: var(--text-on-dark-muted)">{{r.k}}</dt>
          <dd style="margin: 0; color: var(--text-on-dark); text-align: right">{{r.v}}</dd>
        </div>
      </sc-for>
    </dl>
  </main>

  <div style="position: relative; flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px">
    <a href="Portfolio.dc.html" style="min-height: 54px; border-radius: 8px; background: var(--ethix-emerald); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">View portfolio</a>
    <a href="Main.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--text-on-dark)">Back to home</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rule = 'border-top: 1px solid rgba(255,255,255,.14)';
    return {
      rows: [
        { k: 'Portfolio', v: 'Ethical Growth ISA', rule: '' },
        { k: 'Screening', v: 'Passed · 14 categories', rule: rule },
        { k: 'Partner', v: 'FCA-authorised partner', rule: rule },
        { k: 'Settles', v: 'Today, 17:00', rule: rule }
      ]
    };
  }
}
</script>
</body>
</html>
