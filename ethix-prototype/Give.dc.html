<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ETHIX Give</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ethixdesignsystem_3fcc11/styles.css">
<script src="ds/ethixdesignsystem_3fcc11/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A}
a{color:#22A075;text-decoration:none}a:hover{color:#5FBB99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-inverse); color: var(--text-on-dark); font-family: var(--font-text); overflow: hidden">

  <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 56px 24px 16px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-on-dark); background: rgba(255,255,255,.04); color: var(--text-on-dark); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-on-dark)">ETHIX Give</h1>
  </header>

  <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
  <main style="flex: 1 1 auto; overflow: auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 20px">

    <section aria-label="Given this year" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="border-top: 2px solid var(--ethix-emerald); padding-top: 12px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-on-dark)">£640.00</span>
        <span style="font-size: 12px; color: var(--text-on-dark-muted)">Given in 2026</span>
      </div>
      <div style="border-top: 2px solid var(--ethix-emerald); padding-top: 12px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-on-dark)">£160.00</span>
        <span style="font-size: 12px; color: var(--text-on-dark-muted)">Gift Aid added</span>
      </div>
    </section>

    <section aria-label="Choose a cause" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: var(--font-text); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted)">Vetted causes</h2>
      <sc-for list="{{causes}}" as="c" hint-placeholder-count="3">
        <button onClick="{{c.pick}}" aria-pressed="{{c.selected}}" style="text-align: left; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid {{c.border}}; color: var(--text-on-dark); font-family: var(--font-text); cursor: pointer">
          <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Icon" name="{{c.icon}}" size="{{bigIcon}}" base="{{iconBase}}"></x-import>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{c.title}}</span>
            <span style="font-size: 12px; line-height: 1.5; color: var(--text-on-dark-muted)">{{c.sub}}</span>
          </span>
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid {{c.border}}; display: grid; place-items: center; color: var(--g-400); font-size: 12px">{{c.mark}}</span>
        </button>
      </sc-for>
    </section>

    <section aria-label="Amount" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: var(--font-text); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted)">Amount</h2>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{amounts}}" as="a" hint-placeholder-count="4">
          <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Tag" selected="{{a.selected}}" on-click="{{a.pick}}">£{{a.label}}</x-import>
        </sc-for>
      </div>
      <div style="padding: 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); display: flex; flex-direction: column; gap: 18px">
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Switch" tone="dark" label="Give monthly" description="Cancel any time" checked="{{monthly}}" on-change="{{toggleMonthly}}"></x-import>
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Switch" tone="dark" label="Add Gift Aid" description="I am a UK taxpayer" checked="{{giftAid}}" on-change="{{toggleGiftAid}}"></x-import>
      </div>
    </section>

    <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" size="lg" block="{{yes}}" on-click="{{give}}">{{cta}}</x-import>
    <p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--text-on-dark-muted); text-align: center">Every pound you give reaches the charity. We take no fee on gifts.</p>
  </main>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <main style="flex: 1 1 auto; padding: 0 24px 40px; display: flex; flex-direction: column; gap: 24px">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 24px; text-align: center">
        <div aria-hidden="true" style="width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--ethix-emerald); display: grid; place-items: center; margin: 0 auto; color: var(--g-400); font-size: 36px; line-height: 1">✓</div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-on-dark)">Thank <span style="color: var(--g-400)">you.</span></h2>
          <p style="margin: 0; font-size: 15px; line-height: 1.55; color: var(--text-on-dark-muted)">{{doneLine}}</p>
        </div>
        <dl style="margin: 0; padding: 4px 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); text-align: left">
          <div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px"><dt style="color: var(--text-on-dark-muted)">Gift Aid</dt><dd style="margin: 0; color: var(--text-on-dark)">{{aidLine}}</dd></div>
          <div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px; border-top: 1px solid rgba(255,255,255,.14)"><dt style="color: var(--text-on-dark-muted)">Receipt</dt><dd style="margin: 0; color: var(--text-on-dark)">Sent to your email</dd></div>
        </dl>
      </div>
      <a href="Main.dc.html" style="min-height: 54px; border-radius: 8px; background: var(--ethix-emerald); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Back to home</a>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cause: 'climate', amount: 25, monthly: true, giftAid: true };
  }
  renderVals() {
    const s = this.state;
    const list = [
      { id: 'climate', icon: 'grow', title: 'Climate and nature', sub: '4 vetted charities · reforestation and community energy' },
      { id: 'housing', icon: 'save', title: 'Homes for all', sub: '3 vetted charities · emergency housing and tenancy support' },
      { id: 'education', icon: 'analyze', title: 'Money skills', sub: '2 vetted charities · financial education in schools' }
    ];
    const chosen = list.filter((c) => c.id === s.cause)[0];
    const amt = '£' + s.amount + '.00';
    return {
      yes: true,
      bigIcon: 30,
      iconBase: 'ds/ethixdesignsystem_3fcc11/assets/icons',
      causes: list.map((c) => {
        const on = c.id === s.cause;
        return Object.assign({}, c, {
          selected: on,
          border: on ? 'var(--ethix-emerald)' : 'var(--border-on-dark)',
          mark: on ? '✓' : '',
          pick: () => this.setState({ cause: c.id })
        });
      }),
      amounts: [10, 25, 50, 100].map((v) => ({ label: String(v), selected: v === s.amount, pick: () => this.setState({ amount: v }) })),
      monthly: s.monthly,
      giftAid: s.giftAid,
      toggleMonthly: () => this.setState({ monthly: !s.monthly }),
      toggleGiftAid: () => this.setState({ giftAid: !s.giftAid }),
      cta: 'Give ' + amt + (s.monthly ? ' monthly' : ''),
      done: !!s.done,
      notDone: !s.done,
      give: () => this.setState({ done: true }),
      doneLine: 'Your ' + amt + (s.monthly ? ' monthly gift' : ' gift') + ' to ' + chosen.title + ' has been sent.',
      aidLine: s.giftAid ? '+£' + (s.amount * 0.25).toFixed(2) + ' claimed for you' : 'Not added'
    };
  }
}
</script>
</body>
</html>
