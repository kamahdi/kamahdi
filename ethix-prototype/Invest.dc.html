<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ETHIX · Invest</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ethixdesignsystem_3fcc11/styles.css">
<script src="ds/ethixdesignsystem_3fcc11/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A}
a{color:#22A075;text-decoration:none}a:hover{color:#5FBB99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-inverse); color: var(--text-on-dark); font-family: var(--font-text); overflow: hidden">

  <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 56px 24px 16px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-on-dark); background: rgba(255,255,255,.04); color: var(--text-on-dark); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-on-dark)">Invest</h1>
    <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Badge" tone="positive" size="sm" dot="{{yes}}">Screened</x-import>
  </header>

  <main style="flex: 1 1 auto; overflow: auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0 4px">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted)">You invest</div>
      <div style="font-family: var(--font-display); font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; color: var(--text-on-dark)">£{{amount}}</div>
      <div style="font-size: 13px; color: var(--text-on-dark-muted)">Available in ETHIX Wallet · £3,412.80</div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Tag" selected="{{p.selected}}" on-click="{{p.pick}}">£{{p.label}}</x-import>
      </sc-for>
    </div>

    <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Input" tone="dark" label="Amount" prefix="£" value="{{amount}}" on-change="{{setAmount}}" hint="Minimum £250" inputmode="decimal"></x-import>
    <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Select" tone="dark" label="Into" options="{{funds}}"></x-import>

    <section aria-label="Where this money goes" style="border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: var(--font-text); font-size: 14px; font-weight: 600; color: var(--text-on-dark)">Where this money goes</h2>
        <span style="font-size: 12px; color: var(--text-on-dark-muted)">Version 4.2</span>
      </div>
      <sc-for list="{{alloc}}" as="a" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--text-on-dark-muted)"><span>{{a.label}}</span><span style="font-family: var(--font-mono); color: var(--text-on-dark)">{{a.pct}}%</span></div>
          <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,.1)"><div style="height: 100%; border-radius: 2px; background: var(--ethix-emerald); {{a.bar}}"></div></div>
        </div>
      </sc-for>
    </section>

    <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Checkbox" tone="dark" label="I understand the value can fall" description="Screening does not remove market risk." checked="{{confirmed}}" on-change="{{toggle}}"></x-import>

    <sc-if value="{{confirmed}}" hint-placeholder-val="{{ false }}">
      <a href="Sending.dc.html" style="min-height: 54px; border-radius: 8px; background: var(--ethix-emerald); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Confirm £{{amount}}</a>
    </sc-if>
    <sc-if value="{{notConfirmed}}" hint-placeholder-val="{{ true }}">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" size="lg" block="{{yes}}" disabled="{{yes}}">Confirm £{{amount}}</x-import>
    </sc-if>
  </main>

  <nav aria-label="Main" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border-on-dark); background: rgba(10,10,10,.92); padding: 8px 8px 28px">
    <a href="Main.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--text-on-dark-muted)">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Icon" name="save" size="{{tabIcon}}" base="{{iconBase}}" tone="light" style="{{dim}}"></x-import>Home
    </a>
    <a href="Invest.dc.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--g-400)">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Icon" name="invest" size="{{tabIcon}}" base="{{iconBase}}"></x-import>Invest
    </a>
    <a href="Portfolio.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--text-on-dark-muted)">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Icon" name="analyze" size="{{tabIcon}}" base="{{iconBase}}" tone="light" style="{{dim}}"></x-import>Portfolio
    </a>
    <a href="Settings.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--text-on-dark-muted)">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Icon" name="protect" size="{{tabIcon}}" base="{{iconBase}}" tone="light" style="{{dim}}"></x-import>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '250.00', confirmed: false };
  }
  renderVals() {
    const amount = this.state.amount;
    const confirmed = this.state.confirmed;
    return {
      yes: true,
      tabIcon: 22,
      iconBase: 'ds/ethixdesignsystem_3fcc11/assets/icons',
      dim: { opacity: 0.55 },
      amount: amount,
      confirmed: confirmed,
      notConfirmed: !confirmed,
      setAmount: (e) => this.setState({ amount: e.target.value }),
      toggle: () => this.setState({ confirmed: !this.state.confirmed }),
      presets: ['250.00', '500.00', '1,000.00', '2,500.00'].map((v) => ({
        label: v,
        selected: v === amount,
        pick: () => this.setState({ amount: v })
      })),
      funds: ['Ethical Growth ISA', 'Impact Bonds', 'Renewables Fund'],
      alloc: [
        { label: 'Screened equities', pct: 62, bar: 'width: 62%' },
        { label: 'Green bonds', pct: 28, bar: 'width: 28%' },
        { label: 'Cash', pct: 10, bar: 'width: 10%' }
      ]
    };
  }
}
</script>
</body>
</html>
