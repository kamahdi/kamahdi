<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ETHIX · Transfer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ethixdesignsystem_3fcc11/styles.css">
<script src="ds/ethixdesignsystem_3fcc11/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0A0A0A}
a{color:#22A075;text-decoration:none}a:hover{color:#5FBB99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-inverse); color: var(--text-on-dark); font-family: var(--font-text); overflow: hidden">

  <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
    <header style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 56px 24px 16px">
      <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-on-dark); background: rgba(255,255,255,.04); color: var(--text-on-dark); display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <h1 style="flex: 1; margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-on-dark)">Transfer</h1>
    </header>

    <main style="flex: 1 1 auto; overflow: auto; padding: 0 24px 24px; display: flex; flex-direction: column; gap: 20px">
      <section aria-label="Send to" style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-family: var(--font-text); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted)">Send to</h2>
        <sc-for list="{{payees}}" as="p" hint-placeholder-count="3">
          <button onClick="{{p.pick}}" aria-pressed="{{p.selected}}" style="text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid {{p.border}}; color: var(--text-on-dark); font-family: var(--font-text); cursor: pointer">
            <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: var(--g-800); color: var(--g-100); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px">{{p.initials}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{p.name}}</span>
              <span style="font-family: var(--font-mono); font-size: 12px; color: var(--text-on-dark-muted)">{{p.acct}}</span>
            </span>
          </button>
        </sc-for>
        <button style="min-height: 48px; border-radius: 14px; border: 1px dashed var(--border-on-dark); background: transparent; color: var(--text-on-dark); font-family: var(--font-text); font-size: 14px; font-weight: 500; cursor: pointer">New payee</button>
      </section>

      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Input" tone="dark" label="Amount" prefix="£" value="{{amount}}" on-change="{{setAmount}}" hint="From ETHIX Wallet · £3,412.80 available" inputmode="decimal"></x-import>
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Input" tone="dark" label="Reference" value="{{reference}}" on-change="{{setRef}}" hint="Shown on their statement · 18 characters max" maxlength="18"></x-import>

      <div style="padding: 14px 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); display: flex; gap: 12px; align-items: flex-start">
        <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Icon" name="protect" size="{{smIcon}}" base="{{iconBase}}"></x-import>
        <span style="font-size: 13px; line-height: 1.55; color: var(--text-on-dark-muted)">Name checked with their bank: <strong style="color: var(--text-on-dark); font-weight: 600">{{payeeName}}</strong> matches. Faster Payments usually arrive within minutes.</span>
      </div>
    </main>

    <footer style="flex: 0 0 auto; padding: 0 24px 40px">
      <x-import component-from-global-scope="ETHIXDesignSystem_3fcc11.Button" size="lg" block="{{yes}}" on-click="{{send}}">Send £{{amount}}</x-import>
    </footer>
  </sc-if>

  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <main style="flex: 1 1 auto; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 24px">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 24px; text-align: center">
        <div aria-hidden="true" style="width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--ethix-emerald); display: grid; place-items: center; margin: 0 auto; color: var(--g-400); font-size: 36px; line-height: 1">✓</div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-on-dark)">Transfer <span style="color: var(--g-400)">sent.</span></h1>
          <p style="margin: 0; font-size: 15px; color: var(--text-on-dark-muted)">£{{amount}} · settles today</p>
        </div>
        <dl style="margin: 0; padding: 4px 16px; border-radius: 14px; background: var(--surface-inverse-raised); border: 1px solid var(--border-on-dark); text-align: left">
          <div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px"><dt style="color: var(--text-on-dark-muted)">To</dt><dd style="margin: 0; color: var(--text-on-dark)">{{payeeName}}</dd></div>
          <div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px; border-top: 1px solid rgba(255,255,255,.14)"><dt style="color: var(--text-on-dark-muted)">Reference</dt><dd style="margin: 0; color: var(--text-on-dark)">{{reference}}</dd></div>
          <div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px; border-top: 1px solid rgba(255,255,255,.14)"><dt style="color: var(--text-on-dark-muted)">From</dt><dd style="margin: 0; color: var(--text-on-dark)">ETHIX Wallet</dd></div>
        </dl>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <a href="Main.dc.html" style="min-height: 54px; border-radius: 8px; background: var(--ethix-emerald); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Done</a>
        <button onClick="{{again}}" style="min-height: 48px; border: none; background: transparent; color: var(--text-on-dark); font-family: var(--font-text); font-size: 14px; font-weight: 500; cursor: pointer">Make another transfer</button>
      </div>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: false, payee: 'sara', amount: '250.00', reference: 'Rent share' };
  }
  renderVals() {
    const s = this.state;
    const list = [
      { id: 'sara', initials: 'SH', name: 'Sara Haddad', acct: '20-45-67 · 41239987' },
      { id: 'oak', initials: 'OL', name: 'Oakfield Lettings', acct: '30-11-42 · 88120456' },
      { id: 'coop', initials: 'GC', name: 'Greenway Energy Co-op', acct: '60-83-71 · 10294411' }
    ];
    const chosen = list.filter((p) => p.id === s.payee)[0];
    return {
      yes: true,
      smIcon: 22,
      iconBase: 'ds/ethixdesignsystem_3fcc11/assets/icons',
      isForm: !s.done,
      isDone: s.done,
      payees: list.map((p) => Object.assign({}, p, {
        selected: p.id === s.payee,
        border: p.id === s.payee ? 'var(--ethix-emerald)' : 'var(--border-on-dark)',
        pick: () => this.setState({ payee: p.id })
      })),
      payeeName: chosen.name,
      amount: s.amount,
      reference: s.reference,
      setAmount: (e) => this.setState({ amount: e.target.value }),
      setRef: (e) => this.setState({ reference: e.target.value }),
      send: () => this.setState({ done: true }),
      again: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
